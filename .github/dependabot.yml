version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-packaging-tools"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The lint job is pinned to the minimum supported Rust version (1.75.0) on purpose.
      - dependency-name: "dtolnay/rust-toolchain"
      # These only run on release tags, so PR CI cannot test a major bump. Update them by hand
      # right before a release, and check with: Actions -> Release -> Run workflow.
      - dependency-name: "softprops/action-gh-release"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/attest-build-provenance"
        update-types: ["version-update:semver-major"]
