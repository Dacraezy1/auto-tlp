# TLP configuration generated by auto-tlp
# Generated : 2026-11-03 10:00 UTC
# Profile   : balanced
# Machine   : LENOVO ThinkPad X1 Carbon (Notebook)
# CPU       : 11th Gen Intel(R) Core(TM) i7-1185G7
# TLP       : 1.11 (profile-style keys: _ON_PRF / _ON_BAL / _ON_SAV)
# GPU       : Intel Corporation TigerLake-LP GT2 [integrated, driver: i915]
# GPU       : NVIDIA Corporation GA106M [discrete, driver: nvidia]
# Disk      : nvme0n1 NVMe SSD Samsung SSD 980 PRO 512GB (512.1 GB)
# Disk      : sda SSD Samsung SSD 870 EVO 500GB (500.1 GB)
# Disk      : sdb HDD WDC WD10SPZX-24Z10 (1.0 TB)
# Install as /etc/tlp.d/99-auto-tlp.conf, then run: sudo tlp start

# ===== General =====
TLP_ENABLE="1"

# ===== CPU =====
# 11th Gen Intel(R) Core(TM) i7-1185G7 - 4 cores / 8 threads
# scaling driver: intel_pstate (active mode); governors: performance powersave
CPU_SCALING_GOVERNOR_ON_PRF="powersave"
CPU_SCALING_GOVERNOR_ON_BAL="powersave"
CPU_SCALING_GOVERNOR_ON_SAV="powersave"
# Energy/performance preference (EPP) is supported by the driver.
CPU_ENERGY_PERF_POLICY_ON_PRF="balance_performance"
CPU_ENERGY_PERF_POLICY_ON_BAL="balance_power"
CPU_ENERGY_PERF_POLICY_ON_SAV="power"
# Turbo/boost control found (intel_pstate/no_turbo).
CPU_BOOST_ON_PRF="1"
CPU_BOOST_ON_BAL="0"
CPU_BOOST_ON_SAV="0"
CPU_HWP_DYN_BOOST_ON_PRF="1"
CPU_HWP_DYN_BOOST_ON_BAL="0"
CPU_HWP_DYN_BOOST_ON_SAV="0"
CPU_MIN_PERF_ON_PRF="0"
CPU_MIN_PERF_ON_BAL="0"
CPU_MIN_PERF_ON_SAV="0"
CPU_MAX_PERF_ON_PRF="100"
CPU_MAX_PERF_ON_BAL="100"
CPU_MAX_PERF_ON_SAV="60"

# ===== Platform profile (firmware performance/thermal mode) =====
# Firmware offers: low-power balanced performance
PLATFORM_PROFILE_ON_PRF="performance"
PLATFORM_PROFILE_ON_BAL="low-power"
PLATFORM_PROFILE_ON_SAV="low-power"

# ===== Graphics =====
# Intel iGPU (i915): 100-1150 MHz range.
INTEL_GPU_MIN_FREQ_ON_PRF="100"
INTEL_GPU_MIN_FREQ_ON_BAL="100"
INTEL_GPU_MIN_FREQ_ON_SAV="100"
INTEL_GPU_MAX_FREQ_ON_PRF="1150"
INTEL_GPU_MAX_FREQ_ON_BAL="1150"
INTEL_GPU_MAX_FREQ_ON_SAV="700"
INTEL_GPU_BOOST_FREQ_ON_PRF="1150"
INTEL_GPU_BOOST_FREQ_ON_BAL="1150"
INTEL_GPU_BOOST_FREQ_ON_SAV="700"
# NVIDIA proprietary driver on NVIDIA Corporation GA106M.
# NVreg_DynamicPowerManagement is 0 (off): the card cannot runtime-suspend; TLP will leave it alone (see denylist below).

# ===== Storage =====
# nvme0n1: NVMe SSD Samsung SSD 980 PRO 512GB [NVMe, driver nvme, scheduler none]
# sda: SSD Samsung SSD 870 EVO 500GB [SATA, driver ahci, scheduler mq-deadline]
# sdb: HDD WDC WD10SPZX-24Z10 [SATA, driver ahci, scheduler mq-deadline]
# Order of the values below follows DISK_DEVICES.
DISK_DEVICES="nvme0n1 sda sdb"
DISK_IOSCHED="none mq-deadline bfq"
# HDD detected: advanced power management + spindown (needs hdparm). 'keep' leaves non-HDDs untouched.
DISK_APM_LEVEL_ON_PRF="keep keep 254"
DISK_APM_LEVEL_ON_BAL="keep keep 128"
DISK_APM_LEVEL_ON_SAV="keep keep 128"
DISK_SPINDOWN_TIMEOUT_ON_PRF="keep keep 0"
DISK_SPINDOWN_TIMEOUT_ON_BAL="keep keep 120"
DISK_SPINDOWN_TIMEOUT_ON_SAV="keep keep 60"
# SATA link power management policy is exposed by the kernel.
SATA_LINKPWR_ON_PRF="max_performance"
SATA_LINKPWR_ON_BAL="med_power_with_dipm"
SATA_LINKPWR_ON_SAV="med_power_with_dipm"
AHCI_RUNTIME_PM_ON_PRF="on"
AHCI_RUNTIME_PM_ON_BAL="auto"
AHCI_RUNTIME_PM_ON_SAV="auto"
AHCI_RUNTIME_PM_TIMEOUT="15"

# ===== PCIe & runtime power management =====
# PCIe ASPM policies available: default performance powersave powersupersave (current: default).
PCIE_ASPM_ON_PRF="default"
PCIE_ASPM_ON_BAL="powersave"
PCIE_ASPM_ON_SAV="powersupersave"
RUNTIME_PM_ON_PRF="on"
RUNTIME_PM_ON_BAL="auto"
RUNTIME_PM_ON_SAV="auto"
# Drivers excluded from runtime PM (TLP defaults, plus anything this machine needs).
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau radeon xhci_hcd nvidia"

# ===== Network & radios =====
# Wi-Fi: wlp0s20f3 (iwlwifi)
WIFI_PWR_ON_PRF="off"
WIFI_PWR_ON_BAL="on"
WIFI_PWR_ON_SAV="on"
# Ethernet present: disable Wake-on-LAN to save power (set N if you use it).
WOL_DISABLE="Y"
# Optional: switch radios off on battery while they are not connected/in use.
#DEVICES_TO_DISABLE_ON_BAL_NOT_IN_USE="bluetooth"
#DEVICES_TO_DISABLE_ON_SAV_NOT_IN_USE="bluetooth"

# ===== USB =====
USB_AUTOSUSPEND="1"
USB_EXCLUDE_AUDIO="1"
USB_EXCLUDE_BTUSB="0"
USB_EXCLUDE_PHONE="0"
USB_EXCLUDE_PRINTER="1"
USB_EXCLUDE_WWAN="0"
# External input devices kept awake: Logitech Receiver (046d:c52b)
USB_DENYLIST="046d:c52b"

# ===== Audio =====
# Sound cards: PCH
SOUND_POWER_SAVE_ON_PRF="0"
SOUND_POWER_SAVE_ON_BAL="1"
SOUND_POWER_SAVE_ON_SAV="1"
SOUND_POWER_SAVE_CONTROLLER="Y"

# ===== Kernel =====
# Disable the NMI watchdog (saves wake-ups; irrelevant unless you debug lockups).
NMI_WATCHDOG="0"
# Suspend modes offered by firmware: s2idle deep (current: s2idle).
# TLP can switch per power source; left commented because the right choice is machine specific.
#MEM_SLEEP_ON_PRF="s2idle"
#MEM_SLEEP_ON_BAL="deep"
#MEM_SLEEP_ON_SAV="deep"

# ===== Battery care =====
# BAT0: L17M3P55 (Li-poly) health 91%, 212 cycles
START_CHARGE_THRESH_BAT0="75"
STOP_CHARGE_THRESH_BAT0="80"
# 75-80% is a common longevity range; use `sudo tlp fullcharge` for a one-off 100%.
